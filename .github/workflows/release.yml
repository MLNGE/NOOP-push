name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example 0.1.15)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update and validate version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"].strip()
          if not re.fullmatch(r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", version):
              raise SystemExit("version must use MAJOR.MINOR.PATCH format")

          manifest_path = Path("custom_components/noop_push/manifest.json")
          pyproject_path = Path("pyproject.toml")

          manifest = json.loads(manifest_path.read_text())
          current_manifest_version = manifest["version"]
          pyproject = pyproject_path.read_text()
          match = re.search(r'(?m)^version = "([^"]+)"$', pyproject)
          if match is None:
              raise SystemExit("version entry not found in pyproject.toml")
          current_pyproject_version = match.group(1)

          if current_manifest_version != current_pyproject_version:
              raise SystemExit(
                  "manifest.json and pyproject.toml have different versions"
              )

          tag = f"v{version}"
          if os.system(f"git show-ref --tags --verify --quiet refs/tags/{tag}") == 0:
              raise SystemExit(f"tag already exists: {tag}")

          manifest["version"] = version
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          pyproject_path.write_text(
              pyproject[:match.start(1)] + version + pyproject[match.end(1):]
          )
          PY

      - name: Run syntax validation
        run: python -m compileall -q custom_components/noop_push

      - name: Commit version bump
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/noop_push/manifest.json pyproject.toml
          git commit -m "Release v${RELEASE_VERSION}"

      - name: Create tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: git tag -a "v${RELEASE_VERSION}" -m "Release v${RELEASE_VERSION}"

      - name: Push version bump and tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: git push origin HEAD:main "v${RELEASE_VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh release create "v${RELEASE_VERSION}" --title "NOOP Push v${RELEASE_VERSION}" --generate-notes
